[project]
name = "codex-skill-installer"
version = "0.1.0"
description = "Cross-platform desktop app for installing Codex skills from GitHub into a local Codex profile."
readme = "README.md"
authors = [
    { name = "Sunwood-ai-labs", email = "sunwood.ai.labs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
codex-skill-installer = "codex_skill_forge.launcher:run"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codex_skill_forge"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
build = [
    "pyinstaller>=6.12,<7",
]
