name: build-desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
          - os: ubuntu-latest
            suffix: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v5

      - name: Install build dependencies
        run: uv sync --group build

      - name: Build desktop artifact
        run: uv run python scripts/build_desktop.py --artifact-suffix ${{ matrix.suffix }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-skill-installer-${{ matrix.suffix }}
          path: dist/
